<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ status_code }} - Strategy Predictor</title>
    <style>
      :root {
        --bg: #08111f;
        --panel: #101a2d;
        --panel-2: #15233b;
        --text: #eef4ff;
        --muted: #97a7c2;
        --accent: #44c2ff;
        --border: rgba(148, 163, 184, 0.18);
        --warn: #ffbf69;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(68, 194, 255, 0.18), transparent 35%),
          linear-gradient(180deg, #09101d 0%, var(--bg) 100%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .error-shell {
        width: min(760px, calc(100vw - 32px));
        padding: 28px;
      }

      .error-card {
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: linear-gradient(180deg, rgba(16, 26, 45, 0.98), rgba(9, 16, 29, 0.98));
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.48);
      }

      .error-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0.45rem 0.8rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--accent);
        background: rgba(68, 194, 255, 0.08);
        font-size: 0.82rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 10px;
        font-size: clamp(2rem, 5vw, 3.4rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .error-grid {
        display: grid;
        gap: 14px;
        margin-top: 24px;
      }

      .metric {
        padding: 14px 16px;
        border-radius: 14px;
        background: rgba(21, 35, 59, 0.95);
        border: 1px solid var(--border);
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .metric strong {
        display: block;
        margin-top: 6px;
        color: var(--text);
        font-size: 1rem;
        font-weight: 700;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 24px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.8rem 1rem;
        border-radius: 999px;
        border: 1px solid rgba(68, 194, 255, 0.35);
        background: rgba(68, 194, 255, 0.12);
        color: var(--text);
        text-decoration: none;
        font-weight: 700;
      }

      .button.secondary {
        border-color: rgba(148, 163, 184, 0.18);
        background: rgba(255, 255, 255, 0.04);
      }
    </style>
  </head>
  <body>
    <main class="error-shell">
      <section class="error-card">
        <span class="error-badge">Strategy Predictor</span>
        <h1>{{ status_code }} {{ title }}</h1>
        <p>{{ message }}</p>

        <div class="error-grid">
          <div class="metric">
            <span>Status</span>
            <strong>{{ status_code }}</strong>
          </div>
          <div class="metric">
            <span>Recovery</span>
            <strong>Return to the session selector or reload the app</strong>
          </div>
        </div>

        <div class="actions">
          <a class="button" href="/results">Open results</a>
          <a class="button secondary" href="/">Session selector</a>
        </div>
      </section>
    </main>
  </body>
</html>
